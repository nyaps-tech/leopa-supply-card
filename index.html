.id{text-align:center;padding:16px 20px 0}
h1{font-family:Georgia,"Times New Roman",serif;font-weight:400;color:var(--gold);font-size:38px;line-height:1.05}
.role{color:var(--muted);margin-top:8px;font-size:16px;letter-spacing:.2em;text-transform:uppercase}
.icons{display:flex;justify-content:center;gap:14px;margin:26px 0 8px;flex-wrap:wrap;padding:0 16px}
.ic{display:flex;flex-direction:column;align-items:center;gap:7px;text-decoration:none;color:var(--text);font-size:12px;width:68px}
.ic span.b{width:58px;height:58px;border-radius:50%;background:#262626;border:1px solid #3a3a3a;display:grid;place-items:center;transition:.15s;box-shadow:0 4px 10px rgba(0,0,0,.5)}
.ic svg{width:26px;height:26px;fill:var(--gold)}
.ic.wa span.b{background:var(--gold);border-color:var(--gold)}.ic.wa svg{fill:#141414}
.ic:active span.b,.ic:hover span.b{transform:translateY(-3px);border-color:var(--gold)}
.details{margin:22px 24px 0;border-top:1px solid #333;padding-top:20px;text-align:center}
.details a{display:block;color:var(--text);text-decoration:none;font-size:19px;margin-bottom:12px}
.details a.w{color:var(--gold);font-size:14px;word-break:break-all}
.save{margin:22px 24px 0;border-top:1px solid #333;padding-top:22px;display:flex;align-items:center;gap:18px}
.save img{width:128px;height:128px;border-radius:4px;background:#fff;flex:none}
.save p{font-family:Georgia,serif;font-size:20px;line-height:1.3}
.btn{display:inline-flex;align-items:center;gap:8px;margin-top:14px;padding:10px 16px;border-radius:999px;background:var(--gold);color:#141414;font-weight:600;font-size:14px;text-decoration:none;border:0;cursor:pointer;font-family:inherit}
.btn svg{width:18px;height:18px;fill:#141414}
